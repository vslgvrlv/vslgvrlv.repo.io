<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RNP Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1d212b;
      --border: #2a3140;
      --text: #eef2f7;
      --muted: #9aa4b2;
      --accent: #66a3ff;
      --accent-2: #7ee787;
      --danger: #ff7b72;
      --warning: #d29922;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .container {
      max-width: 1520px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .filters .panel {
      padding: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
    }

    button.secondary {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .kpi {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .kpi-title {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    .kpi-delta {
      margin-top: 8px;
      font-size: 12px;
    }

    .up { color: var(--accent-2); }
    .down { color: var(--danger); }
    .neutral { color: var(--muted); }

    .grid-2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .chart-wrap {
      position: relative;
      height: 340px;
    }

    .chart-wrap.small {
      height: 280px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
    }

    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      background: var(--panel);
    }

    .table-wrap {
      max-height: 420px;
      overflow: auto;
    }

    .funnel {
      display: grid;
      gap: 10px;
    }

    .funnel-row {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .funnel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .bar {
      height: 10px;
      border-radius: 999px;
      background: #0f131b;
      overflow: hidden;
    }

    .bar > div {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 14px;
    }

    .compare-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .compare-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .compare-card h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .compare-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 6px 0;
      font-size: 13px;
    }

    @media (max-width: 1200px) {
      .filters, .kpis, .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>RNP Dashboard</h1>
        <div class="sub" id="statusText">Загрузка данных...</div>
      </div>
    </div>

    <div class="filters">
      <div class="panel">
        <label for="dateFrom">Период A — c</label>
        <input type="date" id="dateFrom" />
      </div>

      <div class="panel">
        <label for="dateTo">Период A — по</label>
        <input type="date" id="dateTo" />
      </div>

      <div class="panel">
        <label for="compareFrom">Период B — c</label>
        <input type="date" id="compareFrom" />
      </div>

      <div class="panel">
        <label for="compareTo">Период B — по</label>
        <input type="date" id="compareTo" />
      </div>

      <div class="panel">
        <label for="ownerFilter">Ответственный</label>
        <select id="ownerFilter">
          <option value="all">Все</option>
        </select>
      </div>

      <div class="panel">
        <label for="aggFilter">Агрегация</label>
        <select id="aggFilter">
          <option value="day">По дням</option>
          <option value="week">По неделям</option>
          <option value="month">По месяцам</option>
        </select>
      </div>

      <div class="panel">
        <label>&nbsp;</label>
        <button id="applyBtn">Применить</button>
      </div>

      <div class="panel">
        <label>&nbsp;</label>
        <button class="secondary" id="resetBtn">Сбросить</button>
      </div>
    </div>

    <div class="kpis" id="kpiGrid"></div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">Динамика: расход / лиды / выручка</div>
        <div class="chart-wrap">
          <canvas id="mainChart"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Воронка</div>
        <div id="funnelBox" class="funnel"></div>
      </div>
    </div>

    <div class="grid-3">
      <div class="panel">
        <div class="panel-title">Сравнение Period A vs Period B</div>
        <div class="compare-cards" id="compareCards"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Илья vs Дмитрий</div>
        <div class="chart-wrap small">
          <canvas id="ownerChart"></canvas>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">CPL / CPQL / CPO</div>
        <div class="chart-wrap small">
          <canvas id="costChart"></canvas>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Детализация</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Дата</th>
              <th>Ответственный</th>
              <th>Расход</th>
              <th>Показы</th>
              <th>Клики</th>
              <th>Лиды</th>
              <th>Квал</th>
              <th>Записи</th>
              <th>Доезды</th>
              <th>Оплаты</th>
              <th>Выручка</th>
            </tr>
          </thead>
          <tbody id="detailTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      endpoint: 'https://script.google.com/macros/s/AKfycbxnKjZ7zF-K5EX4gwmcAv4xC7p3WAYaLSZb4A2NAN6xN-KNF9fpHgqOU-83YxegGblBQg/exec',
      mode: 'jsonp'
    };

    let RAW_ROWS = [];
    let mainChart = null;
    let ownerChart = null;
    let costChart = null;

    function loadData() {
      setStatus('Загрузка данных из API...');
      if (CONFIG.mode === 'jsonp') {
        loadJsonp(`${CONFIG.endpoint}?callback=dashboardJsonpCallback`);
      } else {
        fetch(CONFIG.endpoint)
          .then(r => r.json())
          .then(handleApiData)
          .catch(err => {
            console.error(err);
            setStatus('Ошибка загрузки API');
          });
      }
    }

    function loadJsonp(url) {
      window.dashboardJsonpCallback = function(data) {
        handleApiData(data);
      };
      const script = document.createElement('script');
      script.src = url + '&_ts=' + Date.now();
      script.onerror = function() {
        setStatus('Ошибка JSONP-загрузки');
      };
      document.body.appendChild(script);
    }

    function handleApiData(data) {
      if (!data || !data.ok) {
        console.error(data);
        setStatus('API вернул ошибку');
        return;
      }

      RAW_ROWS = Array.isArray(data.rows) ? data.rows : [];
      initFilters(RAW_ROWS);
      applyFiltersAndRender();
      setStatus(`Данные загружены. Строк: ${RAW_ROWS.length}. Обновлено: ${formatDateTime(data.updatedAt)}`);
    }

    function initFilters(rows) {
      const owners = [...new Set(rows.map(r => r.owner).filter(Boolean))].sort();
      const ownerFilter = document.getElementById('ownerFilter');

      ownerFilter.innerHTML = '<option value="all">Все</option>' +
        owners.map(o => `<option value="${o}">${o}</option>`).join('');

      const dates = rows.map(r => r.date).filter(Boolean).sort();
      const minDate = dates[0];
      const maxDate = dates[dates.length - 1];

      if (!document.getElementById('dateFrom').value) document.getElementById('dateFrom').value = minDate;
      if (!document.getElementById('dateTo').value) document.getElementById('dateTo').value = maxDate;

      if (!document.getElementById('compareFrom').value || !document.getElementById('compareTo').value) {
        const range = buildPreviousPeriod(minDate, maxDate);
        document.getElementById('compareFrom').value = range.from;
        document.getElementById('compareTo').value = range.to;
      }
    }

    function buildPreviousPeriod(from, to) {
      const start = new Date(from);
      const end = new Date(to);
      const days = Math.max(1, Math.round((end - start) / 86400000) + 1);

      const prevEnd = new Date(start);
      prevEnd.setDate(prevEnd.getDate() - 1);

      const prevStart = new Date(prevEnd);
      prevStart.setDate(prevStart.getDate() - days + 1);

      return {
        from: toIso(prevStart),
        to: toIso(prevEnd)
      };
    }

    function applyFiltersAndRender() {
      const owner = document.getElementById('ownerFilter').value;
      const agg = document.getElementById('aggFilter').value;

      const periodA = {
        from: document.getElementById('dateFrom').value,
        to: document.getElementById('dateTo').value
      };

      const periodB = {
        from: document.getElementById('compareFrom').value,
        to: document.getElementById('compareTo').value
      };

      let rows = RAW_ROWS.slice();

      if (owner !== 'all') {
        rows = rows.filter(r => r.owner === owner);
      }

      const rowsA = rows.filter(r => inRange(r.date, periodA.from, periodA.to));
      const rowsB = rows.filter(r => inRange(r.date, periodB.from, periodB.to));

      const summaryA = summarize(rowsA);
      const summaryB = summarize(rowsB);

      const seriesA = aggregateRows(rowsA, agg);
      const ownerSplit = summarizeByOwner(rowsA);

      renderKpis(summaryA, summaryB);
      renderFunnel(summaryA);
      renderCompare(summaryA, summaryB);
      renderMainChart(seriesA);
      renderOwnerChart(ownerSplit);
      renderCostChart(summaryA);
      renderTable(seriesA);
    }

    function summarize(rows) {
      const s = rows.reduce((acc, r) => {
        acc.spend += num(r.spend);
        acc.impressions += num(r.impressions);
        acc.clicks += num(r.clicks);
        acc.leads += num(r.leads);
        acc.qualLeads += num(r.qualLeads);
        acc.appointments += num(r.appointments);
        acc.arrivals += num(r.arrivals);
        acc.payments += num(r.payments);
        acc.revenue += num(r.revenue);
        return acc;
      }, {
        spend: 0, impressions: 0, clicks: 0, leads: 0, qualLeads: 0,
        appointments: 0, arrivals: 0, payments: 0, revenue: 0
      });

      s.ctr = pct(s.clicks, s.impressions);
      s.cpl = div(s.spend, s.leads);
      s.cpql = div(s.spend, s.qualLeads);
      s.cpo = div(s.spend, s.payments);
      s.romi = div(s.revenue - s.spend, s.spend) * 100;
      s.avgCheck = div(s.revenue, s.payments);
      s.crLeadToPayment = pct(s.payments, s.leads);
      s.crLeadToQual = pct(s.qualLeads, s.leads);
      s.crQualToAppointment = pct(s.appointments, s.qualLeads);
      s.crAppointmentToArrival = pct(s.arrivals, s.appointments);
      s.crArrivalToPayment = pct(s.payments, s.arrivals);

      return s;
    }

    function summarizeByOwner(rows) {
      const grouped = {};
      rows.forEach(r => {
        if (!grouped[r.owner]) grouped[r.owner] = [];
        grouped[r.owner].push(r);
      });

      const result = {};
      Object.keys(grouped).forEach(owner => {
        result[owner] = summarize(grouped[owner]);
      });
      return result;
    }

    function aggregateRows(rows, level) {
      const map = new Map();

      rows.forEach(r => {
        const key = buildAggKey(r.date, level);
        if (!map.has(key)) {
          map.set(key, {
            date: key,
            owner: 'all',
            spend: 0, impressions: 0, clicks: 0, leads: 0, qualLeads: 0,
            appointments: 0, arrivals: 0, payments: 0, revenue: 0
          });
        }
        const target = map.get(key);
        target.spend += num(r.spend);
        target.impressions += num(r.impressions);
        target.clicks += num(r.clicks);
        target.leads += num(r.leads);
        target.qualLeads += num(r.qualLeads);
        target.appointments += num(r.appointments);
        target.arrivals += num(r.arrivals);
        target.payments += num(r.payments);
        target.revenue += num(r.revenue);
      });

      return [...map.values()].sort((a, b) => a.date.localeCompare(b.date));
    }

    function buildAggKey(dateStr, level) {
      if (level === 'day') return dateStr;
      if (level === 'month') return dateStr.slice(0, 7);

      const d = new Date(dateStr);
      const weekStart = new Date(d);
      const day = (d.getDay() + 6) % 7;
      weekStart.setDate(d.getDate() - day);
      return toIso(weekStart);
    }

    function renderKpis(a, b) {
      const kpis = [
        ['Расход', money(a.spend), delta(a.spend, b.spend, false)],
        ['Лиды', int(a.leads), delta(a.leads, b.leads, true)],
        ['Квал-лиды', int(a.qualLeads), delta(a.qualLeads, b.qualLeads, true)],
        ['Оплаты', int(a.payments), delta(a.payments, b.payments, true)],
        ['Выручка', money(a.revenue), delta(a.revenue, b.revenue, true)],
        ['CPL', money(a.cpl), delta(a.cpl, b.cpl, false, true)],
        ['CPQL', money(a.cpql), delta(a.cpql, b.cpql, false, true)],
        ['CPO', money(a.cpo), delta(a.cpo, b.cpo, false, true)],
        ['ROMI', pctText(a.romi), delta(a.romi, b.romi, true)],
        ['CR лид → оплата', pctText(a.crLeadToPayment), delta(a.crLeadToPayment, b.crLeadToPayment, true)]
      ];

      document.getElementById('kpiGrid').innerHTML = kpis.map(([title, value, d]) => `
        <div class="kpi">
          <div class="kpi-title">${title}</div>
          <div class="kpi-value">${value}</div>
          <div class="kpi-delta ${d.cls}">${d.text}</div>
        </div>
      `).join('');
    }

    function renderFunnel(s) {
      const stages = [
        ['Лиды', s.leads, 100],
        ['Квал-лиды', s.qualLeads, pct(s.qualLeads, s.leads)],
        ['Записи', s.appointments, pct(s.appointments, s.qualLeads)],
        ['Доезды', s.arrivals, pct(s.arrivals, s.appointments)],
        ['Оплаты', s.payments, pct(s.payments, s.arrivals)]
      ];

      document.getElementById('funnelBox').innerHTML = stages.map(([name, value, width]) => `
        <div class="funnel-row">
          <div class="funnel-head">
            <div>${name}</div>
            <div>${int(value)} / ${Number.isFinite(width) ? width.toFixed(1) : '0.0'}%</div>
          </div>
          <div class="bar"><div style="width:${Math.max(0, Math.min(width, 100))}%"></div></div>
        </div>
      `).join('');
    }

    function renderCompare(a, b) {
      const metrics = [
        ['Расход', money(a.spend), money(b.spend)],
        ['Лиды', int(a.leads), int(b.leads)],
        ['Квал-лиды', int(a.qualLeads), int(b.qualLeads)],
        ['Оплаты', int(a.payments), int(b.payments)],
        ['Выручка', money(a.revenue), money(b.revenue)],
        ['CPL', money(a.cpl), money(b.cpl)],
        ['ROMI', pctText(a.romi), pctText(b.romi)]
      ];

      document.getElementById('compareCards').innerHTML = `
        <div class="compare-card">
          <h3>Период A</h3>
          ${metrics.map(m => `<div class="compare-line"><span>${m[0]}</span><strong>${m[1]}</strong></div>`).join('')}
        </div>
        <div class="compare-card">
          <h3>Период B</h3>
          ${metrics.map(m => `<div class="compare-line"><span>${m[0]}</span><strong>${m[2]}</strong></div>`).join('')}
        </div>
      `;
    }

    function renderMainChart(series) {
      const labels = series.map(x => x.date);

      if (mainChart) mainChart.destroy();
      mainChart = new Chart(document.getElementById('mainChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              type: 'bar',
              label: 'Расход',
              data: series.map(x => x.spend)
            },
            {
              type: 'line',
              label: 'Лиды',
              data: series.map(x => x.leads),
              yAxisID: 'y1'
            },
            {
              type: 'line',
              label: 'Выручка',
              data: series.map(x => x.revenue),
              yAxisID: 'y'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { labels: { color: '#eef2f7' } } },
          scales: {
            x: { ticks: { color: '#9aa4b2' }, grid: { color: '#2a3140' } },
            y: { ticks: { color: '#9aa4b2' }, grid: { color: '#2a3140' } },
            y1: { position: 'right', ticks: { color: '#9aa4b2' }, grid: { drawOnChartArea: false } }
          }
        }
      });
    }

    function renderOwnerChart(ownerSplit) {
      const owners = Object.keys(ownerSplit);
      const revenue = owners.map(o => ownerSplit[o].revenue);
      const spend = owners.map(o => ownerSplit[o].spend);
      const payments = owners.map(o => ownerSplit[o].payments);

      if (ownerChart) ownerChart.destroy();
      ownerChart = new Chart(document.getElementById('ownerChart'), {
        type: 'bar',
        data: {
          labels: owners,
          datasets: [
            { label: 'Расход', data: spend },
            { label: 'Выручка', data: revenue },
            { label: 'Оплаты', data: payments, type: 'line', yAxisID: 'y1' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#eef2f7' } } },
          scales: {
            x: { ticks: { color: '#9aa4b2' }, grid: { color: '#2a3140' } },
            y: { ticks: { color: '#9aa4b2' }, grid: { color: '#2a3140' } },
            y1: { position: 'right', ticks: { color: '#9aa4b2' }, grid: { drawOnChartArea: false } }
          }
        }
      });
    }

    function renderCostChart(s) {
      if (costChart) costChart.destroy();
      costChart = new Chart(document.getElementById('costChart'), {
        type: 'bar',
        data: {
          labels: ['CPL', 'CPQL', 'CPO'],
          datasets: [{
            label: 'Стоимость',
            data: [s.cpl, s.cpql, s.cpo]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#eef2f7' } } },
          scales: {
            x: { ticks: { color: '#9aa4b2' }, grid: { color: '#2a3140' } },
            y: { ticks: { color: '#9aa4b2' }, grid: { color: '#2a3140' } }
          }
        }
      });
    }

    function renderTable(rows) {
      document.getElementById('detailTable').innerHTML = rows.map(r => `
        <tr>
          <td>${r.date}</td>
          <td>${r.owner || 'all'}</td>
          <td>${money(r.spend)}</td>
          <td>${int(r.impressions)}</td>
          <td>${int(r.clicks)}</td>
          <td>${int(r.leads)}</td>
          <td>${int(r.qualLeads)}</td>
          <td>${int(r.appointments)}</td>
          <td>${int(r.arrivals)}</td>
          <td>${int(r.payments)}</td>
          <td>${money(r.revenue)}</td>
        </tr>
      `).join('');
    }

    function delta(current, previous, biggerIsBetter = true, inverse = false) {
      if (!previous && !current) return { text: 'Сравнение недоступно', cls: 'neutral' };
      if (!previous) return { text: 'Нет базы для сравнения', cls: 'neutral' };

      const d = ((current - previous) / previous) * 100;
      const positive = inverse ? d < 0 : (biggerIsBetter ? d > 0 : d < 0);

      return {
        text: `${d >= 0 ? '+' : ''}${d.toFixed(1)}% к периоду B`,
        cls: positive ? 'up' : 'down'
      };
    }

    function setStatus(text) {
      document.getElementById('statusText').textContent = text;
    }

    function inRange(date, from, to) {
      return (!from || date >= from) && (!to || date <= to);
    }

    function div(a, b) {
      return b ? a / b : 0;
    }

    function pct(a, b) {
      return b ? (a / b) * 100 : 0;
    }

    function num(v) {
      return Number(v || 0);
    }

    function money(v) {
      return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(num(v)) + ' ₽';
    }

    function int(v) {
      return new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 }).format(num(v));
    }

    function pctText(v) {
      return `${num(v).toFixed(1)}%`;
    }

    function toIso(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDateTime(v) {
      if (!v) return '';
      return new Date(v).toLocaleString('ru-RU');
    }

    document.getElementById('applyBtn').addEventListener('click', applyFiltersAndRender);
    document.getElementById('resetBtn').addEventListener('click', () => {
      const dates = RAW_ROWS.map(r => r.date).filter(Boolean).sort();
      document.getElementById('dateFrom').value = dates[0] || '';
      document.getElementById('dateTo').value = dates[dates.length - 1] || '';
      const prev = buildPreviousPeriod(dates[0], dates[dates.length - 1]);
      document.getElementById('compareFrom').value = prev.from;
      document.getElementById('compareTo').value = prev.to;
      document.getElementById('ownerFilter').value = 'all';
      document.getElementById('aggFilter').value = 'day';
      applyFiltersAndRender();
    });

    loadData();
  </script>
</body>
</html>
